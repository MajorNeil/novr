# One-off: publishes NOVR 0.4.32 from the mod package in release-assets/ (built against the game, which CI doesn't have).
# The installers are built here around that package, the same way a local Release build bundles dist/NOVR.zip.
name: Publish release

on:
  push:
    branches: [claude/awesome-wozniak-nu4f0y]
    paths: [release-assets/**, .github/workflows/publish-release.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: "0.4.32"
      # main after the 0.4.32 merge, which is the source release-assets/NOVR.zip was built from.
      TARGET: "5c191493e941cd67cac2d8b1211e7f04a6c1b22a"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the package and source are 0.4.32
        run: |
          grep -qF "\"$VERSION\")]" NOVR/NOVRPlugin.cs
          unzip -l release-assets/NOVR.zip | grep -q "plugins/NOVR/NOVR.dll"
          echo "f9437d3275ad7d272d8e1e1e4297bbdb4d8aacd4361a04bbb52b4be9060644c7  release-assets/NOVR.zip" | sha256sum -c -

      - name: Build the installers around the package
        run: |
          mkdir -p dist
          cp release-assets/NOVR.zip dist/NOVR.zip
          dotnet build NOVR.Installer/NOVR.Installer.csproj -c Release
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/NOVR.zip dist/NOVR.Installer-Win.exe dist/NOVR.Installer-Linux \
            --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "NOVR $VERSION" --notes-file release-assets/notes.md
